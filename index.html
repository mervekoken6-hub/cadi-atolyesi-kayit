<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadı Atölyesi | Kayıt & Banka Ödemesi</title>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: radial-gradient(circle at top, #2b1c3a, #0e0b14);
      color: #f5eaff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .form-card {
      background: rgba(20, 15, 30, 0.92);
      border-radius: 18px;
      padding: 36px;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.65);
    }

    h1 { text-align: center; margin-bottom: 6px; }
    p.subtitle { text-align: center; font-size: 14px; opacity: .85; margin-bottom: 20px; }

    label { font-size: 13px; margin-bottom: 6px; display: block; }

    input, select {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: none;
      margin-bottom: 16px;
      background: #1f172b;
      color: #fff;
      font-size: 14px;
    }

    .info {
      background: #1a1325;
      border-radius: 12px;
      padding: 14px;
      font-size: 13px;
      margin-bottom: 18px;
      line-height: 1.5;
    }

    button {
      width: 100%;
      padding: 15px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #a855f7, #ec4899);
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }

    .success { display: none; text-align: center; }
    .success h2 { color: #f9a8d4; }
  </style>
</head>
<body>

<div class="form-card" id="formCard">
  <h1>Cadı Atölyesi</h1>
  <p class="subtitle">Atölye Kayıt Formu</p>

  <form id="registerForm">
    <label>Ad Soyad</label>
    <input type="text" id="name" required>

    <label>E-posta</label>
    <input type="email" id="email" required>

    <label>Telefon</label>
    <input type="tel" id="phone" required>

    <label>Tarih</label>
    <input type="date" id="dateInput" required>

    <label>Seans</label>
    <select id="timeSlot" required>
      <option value="">Seçiniz</option>
      <option>09:00-11:30</option>
      <option>12:00-14:30</option>
      <option>15:00-17:30</option>
    </select>

    <label>Atölye</label>
    <select id="workshop" required>
      <option value="">Seçiniz</option>
      <option>Kil Atölyesi</option>
      <option>Küçük Tuval</option>
      <option>Kavanoz Boyama</option>
    </select>

    <label>Ücret</label>
    <input type="number" id="priceInput" required>

    <label>Dekont</label>
    <input type="file" id="receipt" required>

    <button type="submit">Kaydı Gönder</button>
  </form>
</div>

<div class="form-card success" id="successCard">
  <h2>✨ Kayıt Gönderildi</h2>
  <p>Başvurun başarıyla alındı 💜</p>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbzlUME7xuKo-OCqmD5KNquCZVBOxr3n1gR9uPE3n2Gn3rNOQnkGqaYrpfrMKSWKv5qq/exec";

  const form = document.getElementById("registerForm");
  const formCard = document.getElementById("formCard");
  const successCard = document.getElementById("successCard");

  function fileToBase64(file) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(",")[1]);
      reader.readAsDataURL(file);
    });
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    try {
      const file = document.getElementById("receipt").files[0];
      const base64 = await fileToBase64(file);

      const payload = {
        action: "create",
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        phone: document.getElementById("phone").value,
        date: document.getElementById("dateInput").value,
        timeSlot: document.getElementById("timeSlot").value,
        workshop: document.getElementById("workshop").value,
        price: document.getElementById("priceInput").value,
        receiptBase64: base64,
        receiptName: file.name,
        receiptMime: file.type
      };

      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      const data = await res.json();
      if (!data.ok) throw new Error("Hata");

      alert("Kayıt gönderildi 💜");
      formCard.style.display = "none";
      successCard.style.display = "block";

    } catch (err) {
      alert("Bir hata oldu ❌");
    }
  });
</script>

</body>
</html>
