<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Cadı Atölyesi | Kayıt Formu</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* (CSS AYNEN KALDI) */
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:radial-gradient(circle at top,#2b1c3a,#0e0b14);
  color:#f5eaff;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}
.form-card{
  background:rgba(20,15,30,.95);
  border-radius:20px;
  padding:34px;
  width:100%;
  max-width:480px;
  box-shadow:0 25px 50px rgba(0,0,0,.65);
}
h1{text-align:center;margin-bottom:6px;font-weight:700;}
.subtitle{text-align:center;font-size:14px;opacity:.85;margin-bottom:22px;}
label{font-size:13px;font-weight:600;display:block;margin-bottom:6px;}
input,select{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:none;
  margin-bottom:16px;
  background:#1f172b;
  color:#fff;
}
button{
  width:100%;
  padding:16px;
  border-radius:16px;
  border:none;
  background:linear-gradient(135deg,#7c3aed,#ec4899);
  color:#fff;
  font-size:15px;
  font-weight:700;
}
button:disabled{opacity:.5}
.quota-warning{
  display:none;
  margin:12px 0;
  padding:12px;
  border-radius:12px;
  background:rgba(239,68,68,.18);
  color:#fecaca;
  font-weight:700;
  text-align:center;
}
.success{text-align:center;padding:40px 20px;}
</style>
</head>

<body>

<div class="form-card" id="formArea">

<h1>Cadı Atölyesi</h1>
<div class="subtitle">Atölye Kayıt Formu</div>

<form id="registerForm">

<label>Ad Soyad</label>
<input name="name" required>

<label>E-posta</label>
<input type="email" name="email" required>

<label>Telefon</label>
<input name="phone" required>

<label>Tarih</label>
<input type="date" name="date" required>

<label>Seans</label>
<select name="session" required>
  <option value="">Seçiniz</option>
  <option>09.30 – 11.00</option>
  <option>11.20 – 12.50</option>
  <option>14.10 – 15.40</option>
  <option>16.00 – 17.30</option>
  <option>17.50 – 19.20</option>
</select>

<div id="quotaWarning" class="quota-warning">
⚠️ Bu seansın kontenjanı dolmuştur.
</div>

<label>Ücret</label>
<input name="price" value="500" required>

<button type="submit" id="submitBtn">Kaydı Gönder</button>

</form>

</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwmfEVNxdhnUmiGtzF4HO37ICvArzsk-Dl8Jf5sYuVO_JihsLqX1IHL9SbuwWg6SZH1uA/exec";

const form = document.getElementById("registerForm");
const dateInput = form.querySelector('[name="date"]');
const sessionInput = form.querySelector('[name="session"]');
const warningEl = document.getElementById("quotaWarning");
const submitBtn = document.getElementById("submitBtn");

/* 🔥 JSONP KONTENJAN KONTROL */
function checkQuotaJSONP(){
  const date = dateInput.value;
  const session = sessionInput.value;
  if(!date || !session) return;

  const cb = "cb_" + Date.now();
  window[cb] = function(res){
    if(res.full){
      warningEl.style.display = "block";
      submitBtn.disabled = true;
    }else{
      warningEl.style.display = "none";
      submitBtn.disabled = false;
    }
    delete window[cb];
    script.remove();
  };

  const script = document.createElement("script");
  script.src =
    SCRIPT_URL +
    "?check=1" +
    "&date=" + encodeURIComponent(date) +
    "&session=" + encodeURIComponent(session) +
    "&callback=" + cb;

  document.body.appendChild(script);
}

dateInput.addEventListener("change", checkQuotaJSONP);
sessionInput.addEventListener("change", checkQuotaJSONP);

/* FORM GÖNDER */
form.addEventListener("submit", async e=>{
  e.preventDefault();
  if(submitBtn.disabled) return;

  const payload = {
    name: form.name.value,
    email: form.email.value,
    phone: form.phone.value,
    date: form.date.value,
    session: form.session.value,
    price: form.price.value
  };

  const res = await fetch(SCRIPT_URL,{
    method:"POST",
    body: JSON.stringify(payload)
  });
  const json = await res.json();

  if(!json.ok){
    alert(json.error);
    return;
  }

  document.getElementById("formArea").innerHTML =
    "<div class='success'>✨ Kayıt Alındı</div>";
});
</script>

</body>
</html>
