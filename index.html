<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadı Atölyesi | Kayıt</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: radial-gradient(circle at top, #2b1c3a, #0e0b14);
  color: #f5eaff;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.form-card {
  background: rgba(20, 15, 30, 0.95);
  border-radius: 18px;
  padding: 36px;
  width: 100%;
  max-width: 460px;
  box-shadow: 0 25px 50px rgba(0,0,0,0.65);
}

h1 { text-align: center; margin-bottom: 6px; }
.subtitle { text-align: center; font-size: 14px; opacity: .85; margin-bottom: 20px; }

label { font-size: 13px; margin-bottom: 6px; display: block; }

input, select {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: none;
  margin-bottom: 16px;
  background: #1f172b;
  color: #fff;
}

button {
  width: 100%;
  padding: 15px;
  border-radius: 14px;
  border: none;
  background: linear-gradient(135deg, #a855f7, #ec4899);
  color: #fff;
  font-size: 15px;
  cursor: pointer;
}

.info {
  background: #1a1325;
  border-radius: 12px;
  padding: 14px;
  font-size: 13px;
  margin-bottom: 18px;
  line-height: 1.5;
}

.iban {
  color: #f9a8d4;
  font-weight: bold;
}

.note {
  font-size: 11px;
  opacity: .7;
  text-align: center;
  margin-top: 14px;
}

.success {
  display: none;
  text-align: center;
}
</style>
</head>

<body>

<div class="form-card" id="formCard">
  <h1>Cadı Atölyesi</h1>
  <p class="subtitle">Atölye Kayıt Formu</p>

  <form id="registerForm">
    <label>Ad Soyad</label>
    <input type="text" name="name" required>

    <label>E-posta</label>
    <input type="email" name="email" required>

    <label>Telefon</label>
    <input type="tel" name="phone" required>

    <label>Tarih</label>
    <input type="date" name="date" required>

    <label>Seans</label>
    <select name="timeSlot" required>
      <option value="">Seçiniz</option>
      <option>09:00–11:30</option>
      <option>12:00–14:30</option>
      <option>15:00–17:30</option>
    </select>

    <label>Atölye</label>
    <select name="workshop" required>
      <option value="">Seçiniz</option>
      <option>Küçük Tuval Atölyesi</option>
      <option>Kil Atölyesi</option>
      <option>Kavanoz Boyama Atölyesi</option>
    </select>

    <label>Ücret (TL)</label>
    <input type="number" name="price" required>

    <label>Dekont (zorunlu)</label>
    <input type="file" name="receipt" required>

    <div class="info">
      <strong>Banka Havalesi Bilgileri</strong><br><br>
      <strong>Alıcı:</strong> Merve Köken<br>
      <span class="iban">IBAN: TR90 0001 0090 1009 4361 3050 01</span><br>
      Açıklama: <em>Ad Soyad – Atölye Adı</em>
    </div>

    <button type="submit">Kaydı Gönder</button>
  </form>

  <div class="note">
    ⚠️ Ödeme dekontunu WhatsApp üzerinden iletiniz.
  </div>
</div>

<div class="form-card success" id="successCard">
  <h2>✨ Kayıt Alındı</h2>
  <p>Kayıt gönderildi 💜<br>Dekont kontrolünden sonra onaylanacaktır.</p>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzUME7xuKo-OCqmD5KNquCZVBOxr3n1gR9uPE3n2Gn3rNOQnkGqaYrpfrMKSWKv5qq/exec";

document.getElementById("registerForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  try {
    const form = document.getElementById("registerForm");
    const formData = new FormData(form);
    formData.append("action", "create");

    const res = await fetch(API_URL, {
      method: "POST",
      body: formData
    });

    if (!res.ok) throw new Error("Sunucu hatası");

    document.getElementById("formCard").style.display = "none";
    document.getElementById("successCard").style.display = "block";

  } catch (err) {
    alert("Bir hata oluştu ❌");
  }
});
</script>

</body>
</html>
