<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Cadı Atölyesi | Kayıt Formu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: radial-gradient(circle at top, #2b1c3a, #0e0b14);
      color: #f5eaff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .form-card {
      background: rgba(20, 15, 30, 0.92);
      border-radius: 18px;
      padding: 36px;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.65);
    }

    h1 { text-align: center; margin-bottom: 6px; }
    p.subtitle { text-align: center; font-size: 14px; opacity: .85; margin-bottom: 20px; }

    label { font-size: 13px; margin-bottom: 6px; display: block; }

    input, select {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: none;
      margin-bottom: 16px;
      background: #1f172b;
      color: #fff;
      font-size: 14px;
    }

    input::placeholder { color: #bda9d6; }

    .info {
      background: #1a1325;
      border-radius: 12px;
      padding: 14px;
      font-size: 13px;
      margin-bottom: 18px;
      line-height: 1.5;
    }

    .iban {
      font-weight: 600;
      color: #f9a8d4;
      word-break: break-all;
    }

    button {
      width: 100%;
      padding: 15px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #a855f7, #ec4899);
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .note {
      font-size: 11px;
      opacity: .7;
      text-align: center;
      margin-top: 14px;
    }
  </style>
</head>
<body>

<div class="form-card">
  <h1>Cadı Atölyesi</h1>
  <p class="subtitle">Atölye Kayıt Formu (Banka Havalesi)</p>

  <form id="registerForm">

    <label>Ad Soyad</label>
    <input type="text" name="name" required placeholder="Ad Soyad">

    <label>E-posta</label>
    <input type="email" name="email" required placeholder="ornek@mail.com">

    <label>Telefon</label>
    <input type="tel" name="phone" required placeholder="05xx xxx xx xx">

    <label>Tarih</label>
    <input type="date" name="date" required>

    <label>Seans Saati</label>
    <select name="timeSlot" required>
      <option value="">Seçiniz</option>
      <option>09:00 – 11:30</option>
      <option>12:00 – 14:30</option>
      <option>15:00 – 17:30</option>
    </select>

    <label>Atölye</label>
    <select name="workshop" required>
      <option>Küçük Tuval Atölyesi</option>
      <option>Kil Atölyesi</option>
      <option>Kavanoz Boyama Atölyesi</option>
    </select>

    <label>Atölye Ücreti (TL)</label>
    <input type="number" name="price" required placeholder="Örn: 500">

    <label>Dekont Yükle (zorunlu)</label>
    <input type="file" name="receipt" accept="image/*,application/pdf" required>

    <div class="info">
      <strong>Banka Havalesi Bilgileri</strong><br><br>
      Alıcı Adı: <strong>Merve Köken</strong><br>
      <span class="iban">IBAN: TR90 0001 0090 1009 4361 3050 01</span><br><br>
      Açıklama: <em>Ad Soyad – Atölye Adı</em><br>
      <small>Ödeme yapılmadan kayıt onaylanmaz.</small>
    </div>

    <button type="submit" id="submitBtn">Kaydı Gönder</button>
  </form>

  <div class="note">
    ⚠️ Ödeme dekontunu lütfen WhatsApp üzerinden de iletiniz.
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzUME7xuKo-OCqmD5KNquCZVBOxr3n1gR9uPE3n2Gn3rNOQnkGqaYrpfrMKSWKv5qq/exec";

document.getElementById("registerForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  const form = this;
  const btn = document.getElementById("submitBtn");
  btn.disabled = true;
  btn.textContent = "Gönderiliyor...";

  try {
    const formData = new FormData(form);
    formData.append("action", "create");

    const res = await fetch(API_URL, {
      method: "POST",
      body: formData
    });

    if (!res.ok) throw new Error("Bağlantı hatası");

    alert("Kayıt gönderildi 💜");
    form.reset();

  } catch (err) {
    alert("Bir hata oluştu. Lütfen tekrar deneyin.");
    console.error(err);
  } finally {
    btn.disabled = false;
    btn.textContent = "Kaydı Gönder";
  }
});
</script>

</body>
</html>
