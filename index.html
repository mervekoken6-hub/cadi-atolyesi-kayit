<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Cadı Atölyesi | Kayıt</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  background:#0e0b14;
  color:#fff;
  font-family:Segoe UI,sans-serif;
  display:flex;
  justify-content:center;
  padding:40px
}
.form-card{
  background:#140f1e;
  padding:30px;
  border-radius:16px;
  width:100%;
  max-width:420px
}
input,select,button{
  width:100%;
  padding:12px;
  margin-bottom:14px;
  border-radius:10px;
  border:none
}
button{
  background:linear-gradient(135deg,#a855f7,#ec4899);
  color:white;
  font-size:15px;
  cursor:pointer
}
.info{
  background:#1a1325;
  padding:12px;
  border-radius:10px;
  font-size:13px
}
.iban{color:#f9a8d4;font-weight:600}
</style>
</head>

<body>

<div class="form-card">
<h2>Cadı Atölyesi</h2>

<form id="registerForm">

<input name="name" required placeholder="Ad Soyad">
<input type="email" name="email" required placeholder="E-posta">
<input name="phone" required placeholder="Telefon">

<input type="date" name="date" required>

<select name="timeSlot" required>
<option value="">Seans Saati</option>
<option>09:00-11:30</option>
<option>12:00-14:30</option>
<option>15:00-17:30</option>
</select>

<select name="workshop" required>
<option>Küçük Tuval Atölyesi</option>
<option>Kil Atölyesi</option>
<option>Kavanoz Boyama</option>
</select>

<input type="number" name="price" required placeholder="Ücret (TL)">

<input type="file" name="receipt" required>

<div class="info">
<strong>Banka Havalesi</strong><br>
Alıcı: <b>Merve Köken</b><br>
<span class="iban">IBAN: TR90 0001 0090 1009 4361 3050 01</span>
</div>

<button type="submit">Kaydı Gönder</button>
</form>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzUME7xuKo-OCqmD5KNquCZVBOxr3n1gR9uPE3n2Gn3rNOQnkGqaYrpfrMKSWKv5qq/exec";

document.getElementById("registerForm").addEventListener("submit", async function(e){
  e.preventDefault();

  const formData = new FormData(this);
  formData.append("action","create");

  try{
    const res = await fetch(API_URL,{
      method:"POST",
      body:formData
    });

    if(!res.ok) throw new Error("Sunucu hatası");

    alert("Kayıt gönderildi 💜");
    this.reset();

  }catch(err){
    alert("Bir hata oluştu ❌");
    console.error(err);
  }
});
</script>

</body>
</html>
