<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Cadı Atölyesi | Kayıt Formu</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* ⚠️ TASARIM DEĞİŞMEDİ */
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:radial-gradient(circle at top,#2b1c3a,#0e0b14);
  color:#f5eaff;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}
.form-card{background:rgba(20,15,30,.95);border-radius:20px;padding:34px;width:100%;max-width:480px;box-shadow:0 25px 50px rgba(0,0,0,.65);}
label{font-size:13px;font-weight:600;display:block;margin-bottom:6px;}
input,select{width:100%;padding:12px;border-radius:12px;border:none;margin-bottom:16px;background:#1f172b;color:#fff;}
button{width:100%;padding:16px;border-radius:16px;border:none;background:linear-gradient(135deg,#7c3aed,#ec4899);color:#fff;font-size:15px;font-weight:700;cursor:pointer;}
.success{text-align:center;padding:40px 20px;}
</style>
</head>

<body>

<div class="form-card" id="formArea">
<h1>Cadı Atölyesi</h1>

<form id="registerForm">

<label>Ad Soyad</label>
<input name="name" required>

<label>E-posta</label>
<input type="email" name="email" required>

<label>Telefon</label>
<input type="tel" name="phone" required>

<label>Tarih</label>
<input type="date" name="date" required>

<label>Seans Saati</label>
<select name="session" required>
  <option value="">Seçiniz</option>
  <option>09.30 – 11.00</option>
  <option>11.20 – 12.50</option>
  <option>14.10 – 15.40</option>
  <option>16.00 – 17.30</option>
  <option>17.50 – 19.20</option>
</select>

<label>Ücret (TL)</label>
<input type="number" name="price" value="500" required>

<button type="submit">Kaydı Gönder</button>
</form>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwmfEVNxdhnUmiGtzF4HO37ICvArzsk-Dl8Jf5sYuVO_JihsLqX1IHL9SbuwWg6SZH1uA/exec";

document.getElementById("registerForm").addEventListener("submit", function(e){
  e.preventDefault();

  const formData = new FormData(e.target);
  formData.append("note", "");
  formData.append("lang", "tr");

  fetch(SCRIPT_URL,{ method:"POST", body:formData })
    .then(r=>r.json())
    .then(res=>{
      if(!res.ok){
        alert(res.error);
        return;
      }
      document.getElementById("formArea").innerHTML = `
        <div class="success">
          <h2>✨ Kayıt Alındı</h2>
          <p>Ödeme kontrolünden sonra<br>kaydınız tamamlanacaktır.</p>
        </div>
      `;
    })
    .catch(()=>{
      alert("Bağlantı hatası. Lütfen tekrar deneyin.");
    });
});
</script>

</body>
</html>
