<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Cadı Atölyesi | Kayıt Formu</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:radial-gradient(circle at top,#2b1c3a,#0e0b14);
  color:#f5eaff;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}
.form-card{
  background:rgba(20,15,30,.95);
  border-radius:20px;
  padding:32px;
  width:100%;
  max-width:520px;
  box-shadow:0 25px 50px rgba(0,0,0,.6);
}
label{
  font-weight:700;
  margin-bottom:6px;
  display:block;
}
input,select{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:none;
  margin-bottom:18px;
  background:#1f172b;
  color:#fff;
}
button{
  width:100%;
  padding:16px;
  border-radius:18px;
  border:none;
  background:linear-gradient(90deg,#7c3aed,#8b5cf6,#a78bfa);
  color:#fff;
  font-size:16px;
  font-weight:800;
}
</style>
</head>

<body>

<div class="form-card">
<h2 style="text-align:center">Cadı Atölyesi</h2>

<form
  method="POST"
  action="https://script.google.com/macros/s/AKfycbwCoc-vxyBvIz--3QMlLXxHmOxF-1KVWBkKlIXHP_tJz47FGY9CvWecpoZpTJTyEpHWuA/exec"
  target="hidden_iframe"
>

<label>Ad Soyad</label>
<input name="adSoyad" required>

<label>E-posta</label>
<input type="email" name="email" required>

<label>Telefon (WhatsApp)</label>
<input type="tel" name="telefon" required>

<label>Tarih</label>
<input type="date" name="tarih" required>

<label>Seans Saati</label>
<select name="seans" required>
  <option>09.30 – 11.00</option>
  <option>11.20 – 12.50</option>
  <option>14.10 – 15.40</option>
  <option>16.00 – 17.30</option>
  <option>17.50 – 19.20</option>
</select>

<label>Ücret</label>
<input type="number" name="ucret" value="500" required>

<button type="submit">Kaydı Gönder</button>
</form>

<iframe name="hidden_iframe" style="display:none;"></iframe>

</div>

<script>
document.querySelector("form").addEventListener("submit", function(){
  alert("Kayıt başarıyla alındı 💜");
});
</script>

</body>
</html>
